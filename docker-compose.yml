x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

x-mcp-environment: &mcp-environment
  SEARXNG_URL: http://searxng:8080
  CRAWL4AI_URL: http://crawl4ai:11235
  RERANK_BACKEND: ${RERANK_BACKEND:-flashrank}
  VALKEY_URL: redis://valkey:6379/0
  FASTMCP_DOCKET_URL: redis://valkey:6379/1
  FASTMCP_STATELESS_HTTP: "true"
  RERANK_MODEL: ${RERANK_MODEL:-ms-marco-MiniLM-L-12-v2}
  RERANK_DEVICE: ${RERANK_DEVICE:-cpu}
  RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-16}
  RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-512}
  REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30}
  MAX_RESULTS: ${MAX_RESULTS:-20}
  MAX_SCRAPE: ${MAX_SCRAPE:-10}
  MAX_CANDIDATES: ${MAX_CANDIDATES:-60}
  CACHE_TTL_S: ${CACHE_TTL_S:-3600}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENABLE_SEMANTIC_CACHE: ${ENABLE_SEMANTIC_CACHE:-1}
  SEMANTIC_BACKEND: ${SEMANTIC_BACKEND:-valkey-search}
  SEMANTIC_MIN_SCORE: ${SEMANTIC_MIN_SCORE:-0.45}
  SEMANTIC_MAX_CHUNKS_PER_PAGE: ${SEMANTIC_MAX_CHUNKS_PER_PAGE:-40}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
  EMBEDDING_QUERY_PREFIX: '${EMBEDDING_QUERY_PREFIX:-Represent this sentence for searching relevant passages: }'
  EMBEDDING_PASSAGE_PREFIX: '${EMBEDDING_PASSAGE_PREFIX:-}'
  SEMANTIC_TOP_K: ${SEMANTIC_TOP_K:-20}
  EVIDENCE_TTL_S: ${EVIDENCE_TTL_S:-604800}
  ENABLE_LFM_PREPROCESSING: ${ENABLE_LFM_PREPROCESSING:-0}
  LFM_BASE_URL: ${LFM_BASE_URL:-http://lfm:8080/v1}
  LFM_MODEL: ${LFM_MODEL:-LFM2.5-2.6B-Q8_0.gguf}
  LFM_HF_REPO: ${LFM_HF_REPO:-LiquidAI/LFM2.5-2.6B-GGUF}
  LFM_HF_FILE: ${LFM_HF_FILE:-LFM2.5-2.6B-Q8_0.gguf}
  LFM_API_KEY: ${LFM_API_KEY:-}
  LFM_TIMEOUT: ${LFM_TIMEOUT:-45}
  LFM_MAX_INPUT_CHARS: ${LFM_MAX_INPUT_CHARS:-24000}

services:
  web-search-mcp:
    build: .
    container_name: web-search-mcp
    restart: unless-stopped
    ports:
      - "${MCP_HOST_PORT:-8002}:8000"
    environment:
      <<: *mcp-environment
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).read()"]
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web-search-mcp-canary:
    build: .
    container_name: web-search-mcp-canary
    profiles: ["canary"]
    restart: unless-stopped
    ports:
      - "${MCP_CANARY_HOST_PORT:-18002}:8000"
    environment:
      <<: *mcp-environment
      VALKEY_URL: redis://valkey:6379/2
      FASTMCP_DOCKET_URL: redis://valkey:6379/3
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).read()"]
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      valkey:
        condition: service_healthy

  lfm:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b10326@sha256:bedbb0f38ff2c84893d2df350473fd438875d9ec23d23ce98e96df240e77d6ba}
    container_name: web-search-lfm
    profiles: ["lfm"]
    restart: unless-stopped
    cpus: ${LFM_CPUS:-8}
    mem_limit: ${LFM_MEMORY_LIMIT:-6g}
    environment:
      - LLAMA_CACHE=/models
    command:
      - --hf-repo
      - ${LFM_HF_REPO:-LiquidAI/LFM2.5-2.6B-GGUF}
      - --hf-file
      - ${LFM_HF_FILE:-LFM2.5-2.6B-Q8_0.gguf}
      - --alias
      - ${LFM_MODEL:-LFM2.5-2.6B-Q8_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --device
      - none
      - --n-gpu-layers
      - "0"
      - --ctx-size
      - ${LFM_CTX_SIZE:-8192}
      - --parallel
      - "1"
      - --threads
      - ${LFM_THREADS:-8}
      - --threads-batch
      - ${LFM_THREADS_BATCH:-8}
      - --batch-size
      - ${LFM_BATCH_SIZE:-512}
      - --ubatch-size
      - ${LFM_UBATCH_SIZE:-128}
    volumes:
      - lfm-models:/models
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10m
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]

  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:2026.8.5-1689cb1b5}
    container_name: searxng
    restart: unless-stopped
    volumes:
      # Mount only settings.yml as read-only so the SearXNG entrypoint can't
      # chown the whole host config dir to its internal UID (977), which
      # wedges host-side git operations on searxng/config/*. The template
      # is host-only (rendered into settings.yml by `just setup`); /etc/searxng
      # inside the container stays writable in the container layer for uwsgi.ini
      # and other image-generated files.
      - ./searxng/config/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).read()"]

  crawl4ai:
    image: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.9.2}
    container_name: crawl4ai
    restart: unless-stopped
    shm_size: 1g
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11235/health', timeout=3).read()"]

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey-bundle:9.0.5}
    container_name: valkey
    restart: unless-stopped
    # RDB snapshots are enough: the cache is regenerable — we don't need AOF durability.
    # Save after: 5m & ≥1 key, 1m & ≥100 keys, 30s & ≥10k keys.
    command: ["--save", "300 1", "--save", "60 100", "--save", "30 10000", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - valkey-data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "valkey-cli", "ping"]

volumes:
  searxng-data:
  valkey-data:
  lfm-models:
